name: Update profile cards and snake

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=242630&title_color=e9aec5&text_color=e6e1e8&icon_color=e9aec5&border_color=55515f&border_radius=6&custom_title=ryxon%27s%20GitHub%20stats
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&bg_color=242630&title_color=e9aec5&text_color=e6e1e8&border_color=55515f&border_radius=6&custom_title=Most%20used%20languages
          path: dist/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate pink snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23bc7093&color_dots=%23f5eee6,%23f3dce6,%23e9aec5,%23ce86a5,%239f5579
            dist/snake-dark.svg?palette=github-dark&color_snake=%23e9aec5&color_dots=%2325222b,%23503a48,%2384546d,%23bc809a,%23f0c3d6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated images to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd dist
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg snake-dark.svg stats.svg languages.svg
          git commit -m "Update profile cards and snakes"
          git remote add origin "https://github.com/${REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push --force origin output
